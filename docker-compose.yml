services:
  redis:
    image: redis:7-alpine
    container_name: incidentflow-redis
    ports:
      - "6381:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - incidentflow-redis-data:/data

volumes:
  incidentflow-redis-data:
